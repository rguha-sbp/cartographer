[project]
name = "cartographer"
version = "0.2.0"
description = "Terraform folder to Lucid-compatible draw.io architecture diagram"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["python-hcl2"]

[project.scripts]
cartographer = "cartographer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cartographer"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 120
extend-exclude = ["tests/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
