name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run --locked ruff check
      - run: uv run --locked pytest -q
      - name: Plugin launcher runs on this OS
        shell: bash
        run: sh scripts/cartographer "$RUNNER_TEMP/plugin-data" --help && test -d "$RUNNER_TEMP/plugin-data/uv"
