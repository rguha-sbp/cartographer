name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  suite:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run --locked ruff check
      - run: uv run --locked pytest -q
      - name: Plugin launcher runs on this OS
        shell: bash
        run: sh scripts/cartographer "$RUNNER_TEMP/plugin-data" --help && test -d "$RUNNER_TEMP/plugin-data/uv"

  # The one check branch protection requires: it reports the result of every OS above, so the matrix can change
  # without touching the protection settings.
  test:
    if: always()
    needs: suite
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.suite.result }}" = success

  # A release tag names the version the plugin and the package declare, so `claude plugin update` sees the release.
  tag-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: test "$GITHUB_REF_NAME" = "v$(jq -r .version .claude-plugin/plugin.json)"
